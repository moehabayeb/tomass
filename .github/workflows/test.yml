name: tests

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Repo uses npm (package-lock.json). `npm install` runs the patch-package
      # postinstall (applies the native TTS audio-session patch) and reconciles
      # the lockfile. (The old workflow used pnpm + a non-existent test:e2e script,
      # so it failed at install on every push — it never actually ran.)
      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Scoped to the portable/deterministic suites. The Radix-based component
      # tests fail in the CI jsdom env (pre-existing, environment-only), so we run
      # the meaningful logic + content-gate suites that must always pass.
      - name: Unit tests (portable suites)
        run: >
          npx vitest run
          src/utils/lessons/contentValidation.test.ts
          src/constants/moduleRanges.test.ts
          src/utils/evaluator.openResponse.test.ts
          src/utils/lessons/mcqGate.test.ts
