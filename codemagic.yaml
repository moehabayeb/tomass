workflows:
  ios-workflow:
    name: iOS Build & Publish
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Tomas2

    environment:
      groups:
        - signing
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tomashoca.app"
      node: 20
      # Apple requires the iOS 26 SDK (Xcode 26+) for all App Store Connect uploads.
      # `latest` = Codemagic's newest stable Xcode, so this stays valid as Apple bumps the SDK.
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CM_CERTIFICATE_PRIVATE_KEY

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Use profiles
        script: |
          xcode-project use-profiles

      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Force iOS version + build number
        script: |
          cd ios/App
          # Marketing version (CFBundleShortVersionString) — must be a NEW value for
          # a new App Store release. Bump here when shipping a new version.
          agvtool new-marketing-version 1.2.2
          # Auto-increment & always stay above the old hard-coded 103, so App Store
          # Connect never rejects the upload as a duplicate build number.
          # $BUILD_NUMBER is Codemagic's per-build counter (monotonic).
          agvtool new-version -all $(($BUILD_NUMBER + 103))

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-workflow:
    name: Android Build & Publish
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - signing
      node: 20
      java: 21

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Force Android version
        script: |
          cd android
          # Auto-increment versionCode (monotonic, above old 103) so Google Play
          # never rejects the AAB as a duplicate/lower version code.
          sed -i '' "s/versionCode [0-9]*/versionCode $(($BUILD_NUMBER + 103))/" app/build.gradle
          sed -i '' 's/versionName "[^"]*"/versionName "1.2.2"/' app/build.gradle

      - name: Set up Android signing
        script: |
          cat > android/keystore.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../tomass-release.keystore
          EOF

      - name: Build Android AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal